services:
  nome_modulo.forecast_client:
    class: Drupal\nome_modulo\Service\ForecastClient
    arguments:
      - '@http_client'
      - '@config.factory'
      - '@cache.nome_modulo'
      - '@datetime.time'

  Drupal\nome_modulo\Service\ForecastClientInterface: '@nome_modulo.forecast_client'

  nome_modulo.location_geocoder:
    class: Drupal\nome_modulo\Service\OpenMeteoLocationGeocoder
    arguments:
      - '@http_client'

  Drupal\nome_modulo\Service\LocationGeocoderInterface: '@nome_modulo.location_geocoder'

  nome_modulo.forecast_status_storage:
    class: Drupal\nome_modulo\ForecastStatusStorage
    arguments:
      - '@state'

  Drupal\nome_modulo\ForecastStatusStorage: '@nome_modulo.forecast_status_storage'

  cache.nome_modulo:
    class: Drupal\Core\Cache\CacheBackendInterface
    tags:
      - { name: cache.bin }
    factory: ['@cache_factory', 'get']
    arguments:
      - nome_modulo

  nome_modulo.weather_event_subscriber:
    class: Drupal\nome_modulo\EventSubscriber\WeatherEventSubscriber
    arguments:
      - '@cache_tags.invalidator'
      - '@logger.channel.nome_modulo'
    tags:
      - { name: event_subscriber }

  logger.channel.nome_modulo:
    parent: logger.channel_base
    arguments:
      - 'nome_modulo'

  nome_modulo.weather_alert_uninstall_validator:
    class: Drupal\nome_modulo\Extension\WeatherAlertUninstallValidator
    arguments:
      - '@entity_type.manager'
      - '@string_translation'
    tags:
      - { name: module_install.uninstall_validator }
