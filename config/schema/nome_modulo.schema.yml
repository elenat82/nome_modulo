nome_modulo.settings:
  type: config_object
  label: 'Nome Modulo settings'
  mapping:
    location:
      type: string
      label: 'Location'
    latitude:
      type: float
      label: 'Latitude'
    longitude:
      type: float
      label: 'Longitude'
    timezone:
      type: string
      label: 'Timezone'
    forecast_days:
      type: integer
      label: 'Forecast days'
    temperature_unit:
      type: string
      label: 'Temperature unit'

block.settings.nome_modulo_forecast:
  type: block_settings
  label: 'Weather forecast block settings'
  mapping:
    display:
      type: string
      label: 'Display mode'
    number_of_days:
      type: integer
      label: 'Number of days'
    show_link:
      type: boolean
      label: 'Show full forecast link'
