nome_modulo.forecast:
  path: '/weather/{display}'
  defaults:
    _controller: '\Drupal\nome_modulo\Controller\ForecastController::build'
    _title: 'Weather forecast'
    display: 'summary'
  requirements:
    _permission: 'view weather forecast'
    display: 'summary|extended'
  methods: [GET]

nome_modulo.settings:
  path: '/admin/config/services/nome-modulo'
  defaults:
    _form: '\Drupal\nome_modulo\Form\SettingsForm'
    _title: 'Weather forecast settings'
  requirements:
    _permission: 'administer weather settings'
